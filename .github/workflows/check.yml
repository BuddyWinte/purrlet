name: Check

on:
    push:
    pull_request:

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check formatting
              run: bun run format:check

            - name: Lint
              run: bun run lint

            - name: Typecheck
              run: bun run typecheck

            - name: Build
              run: bun run build

            - name: Test
              run: bun run test
