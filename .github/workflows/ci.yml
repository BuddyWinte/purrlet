name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check lockfile integrity
        run: npm ls

      - name: Run lint
        run: npm run lint

      - name: Type check (no emit)
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: security audit
        run: npm audit --audit-level=high

      - name: Build project
        run: npm run build

      - name: Verify build output exists
        run: test -d dist